<ion-header>
  <ion-toolbar>
    <ion-title>Messages</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content>
  <ion-grid>
    <ion-row>
      <ion-col size="12" *ngFor="let message of messages">
        <ion-card button [routerLink]="['/read-message', message.id]" >
          <ion-card-header>
            <ion-card-title>{{message.sender}}</ion-card-title>
          </ion-card-header>

          <ion-card-content>
            <p>{{message.receivingDate | date:'short'}}</p>
          </ion-card-content>
        </ion-card>
      </ion-col>
    </ion-row>
  </ion-grid>
</ion-content>
